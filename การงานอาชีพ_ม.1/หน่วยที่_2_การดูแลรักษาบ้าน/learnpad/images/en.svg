<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 36" width="600" height="360">
  <!-- Background -->
  <rect width="60" height="36" fill="#012169"></rect>

  <!-- White diagonals -->
  <path d="M0 0 L60 36 M60 0 L0 36" stroke="#FFFFFF" stroke-width="12" stroke-linecap="butt"></path>

  <!-- Red diagonals -->
  <path d="M0 0 L60 36 M60 0 L0 36" stroke="#C8102E" stroke-width="6" stroke-linecap="butt"></path>

  <!-- White cross (St Andrew + fimbriation for St George) -->
  <rect x="24" y="0" width="12" height="36" fill="#FFFFFF"></rect>
  <rect x="0" y="12" width="60" height="12" fill="#FFFFFF"></rect>

  <!-- Red cross (St George) -->
  <rect x="26.4" y="0" width="7.2" height="36" fill="#C8102E"></rect>
  <rect x="0" y="14.4" width="60" height="7.2" fill="#C8102E"></rect>
</svg>
